# mise.toml - dev tooling/tasks for THIS plugin repo (not consumed by plugin users).

[tools]
stylua = "latest"

[tasks.lint]
description = "Format check (stylua)"
run = "stylua --check ."

[tasks.test]
description = "Smoke: link plugin, install pass-cli@latest, run --version"
depends = ["lint"]
run = "mise plugins link pass-cli . && mise install pass-cli@latest && mise exec pass-cli@latest -- pass-cli --version"

[tasks.ci]
description = "What CI runs (lint + smoke install)"
depends = ["lint", "test"]
